name: Brand contract sync

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-brand-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile repository
        uses: actions/checkout@v4

      - name: Fetch canonical website contract
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/Phuturedigital/withhelp/version_4/shared/with-brand-contract.json \
            -o /tmp/with-brand-contract-canonical.json

      - name: Compare contracts semantically
        run: |
          jq -S . /tmp/with-brand-contract-canonical.json > /tmp/canonical.sorted.json
          jq -S . shared/with-brand-contract.json > /tmp/mobile.sorted.json
          if ! diff -u /tmp/canonical.sorted.json /tmp/mobile.sorted.json; then
            echo "WITH. brand contract is out of sync."
            echo "Update shared/with-brand-contract.json from Phuturedigital/withhelp before merging mobile UI changes."
            exit 1
          fi
          echo "WITH. brand contract is in sync."
